<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - SiPintu</title>
    <meta name="theme-color" content="#047857">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-wrap {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #ecfdf5;
            border: 2px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 8px;
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .offline-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: #f59e0b;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 24px;
        }
        .btn-reload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #047857;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
        }
        .btn-reload:hover {
            background-color: #065f46;
        }
        .btn-reload:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/icons/icon-192x192.png" alt="SiPintu Logo">
        </div>
        <svg class="offline-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.166a1 1 0 111.414 1.414M3 3l18 18"></path>
        </svg>
        <h1>Koneksi Terputus</h1>
        <p>Aplikasi SiPintu membutuhkan koneksi internet untuk memuat data. Silakan periksa jaringan Wi-Fi atau data seluler Anda.</p>
        <button class="btn-reload" onclick="window.location.reload()">
            <svg style="width:16px;height:16px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Coba Muat Ulang
        </button>
    </div>
    <div class="footer-text">SiPintu &bull; SMKN 1 Bangsri</div>

    <script>
        // Auto reload when connection is restored
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
